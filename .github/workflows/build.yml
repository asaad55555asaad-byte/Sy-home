name: Build
on:
  workflow_dispatch:
  push:
    paths: ['SyHome.zip']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q SyHome.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # تجهيز Android SDK: تثبيت الأدوات وقبول التراخيص تلقائياً
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Accept licenses
        run: yes | sdkmanager --licenses || true

      # إنشاء المفتاح تلقائياً (فقط إذا لم يكن موجوداً)
      - name: Create keystore if missing
        run: |
          mkdir -p SyHome/keystore
          if [ ! -f SyHome/keystore/syhome.jks ]; then
            keytool -genkeypair -v \
              -keystore SyHome/keystore/syhome.jks \
              -alias syhome \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass syhome123 -keypass syhome123 \
              -dname "CN=Sy Home, OU=Dev, O=SyHome, C=DE"
          else
            echo "Keystore already exists"
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      # بناء التطبيق والمثبّت
      - name: Build apps
        run: gradle -p SyHome :installer:assembleDebug :app:assembleDebug --no-daemon

      # رفع ملفات APK إلى Artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: SyHome-apks
          path: |
            SyHome/installer/build/outputs/apk/debug/installer-debug.apk
            SyHome/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
