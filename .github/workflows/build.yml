name: Build
on:
  workflow_dispatch:
  push:
    paths: ['SyHome.zip']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q SyHome.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle -p SyHome :installer:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SyHome-apks
          path: |
            SyHome/installer/build/outputs/apk/debug/installer-debug.apk
            SyHome/app/build/outputs/apk/debug/app-debug.apk
