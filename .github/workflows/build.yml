name: Build

on:
  workflow_dispatch:
  push:
    paths: ['*.zip']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # اختيار أحدث ملف ZIP حسب رقم النسخة
      - name: Pick latest zip
        id: zip
        run: |
          FILE=$(ls SyHome_v*.zip 2>/dev/null | grep -vi "mobile" | sort -V | tail -n1 || true)
          if [ -z "$FILE" ] && [ -f "SyHome.zip" ]; then
            FILE="SyHome.zip"
          fi
          if [ -z "$FILE" ] || [ ! -f "$FILE" ]; then
            echo "No SyHome zip found"
            ls -la
            exit 1
          fi
          echo "Using: $FILE"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # إنشاء مفاتيح التوقيع
      - name: Create signing keys once and save to repo
        run: |
          mkdir -p keystore

          if [ ! -f keystore/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore keystore/debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -f keystore/syhome.jks ]; then
            keytool -genkeypair -v \
              -keystore keystore/syhome.jks \
              -alias syhome \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass syhome123 -keypass syhome123 \
              -dname "CN=Sy Home, OU=Dev, O=SyHome, C=DE"
          fi

          if [ -n "$(git status --porcelain keystore)" ]; then
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add keystore
            git commit -m "Add signing keystore (one time)"
            git push
          fi

          mkdir -p ~/.android
          cp keystore/debug.keystore ~/.android/debug.keystore

      # فك ضغط المشروع
      - name: Unzip project
        run: unzip -q -o "${{ steps.zip.outputs.file }}"

      # وضع مفتاح التوقيع داخل المشروع
      - name: Put keystore in project
        run: |
          mkdir -p SyHome/keystore
          cp keystore/syhome.jks SyHome/keystore/syhome.jks

      # تجهيز Android SDK
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Accept licenses
        run: yes | sdkmanager --licenses || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      # بناء Sy Home فقط بدون Installer
      - name: Build Sy Home
        run: gradle -p SyHome :app:assembleDebug --no-daemon

      # رفع APK الخاص بالتطبيق
      - uses: actions/upload-artifact@v4
        with:
          name: SyHome-APK
          path: SyHome/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
