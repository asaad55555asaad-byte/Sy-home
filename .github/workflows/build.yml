name: Build

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - 'SyHome/**'
      - '.github/workflows/build.yml'

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Newest SyHome_v*.zip in the repo root (version order), else SyHome.zip
      - name: Pick latest zip
        id: zip
        run: |
          FILE=$(ls SyHome_v*.zip 2>/dev/null | sort -V | tail -n1 || true)
          if [ -z "$FILE" ] && [ -f "SyHome.zip" ]; then FILE="SyHome.zip"; fi
          if [ -z "$FILE" ] || [ ! -f "$FILE" ]; then
            echo "No SyHome zip found"; ls -la; exit 1
          fi
          echo "Using: $FILE"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Signing keys: created once and kept in the repo (same keys = the app can be updated over the old one)
      - name: Create signing keys once and save to repo
        run: |
          mkdir -p keystore
          if [ ! -f keystore/debug.keystore ]; then
            keytool -genkeypair -v -keystore keystore/debug.keystore -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f keystore/syhome.jks ]; then
            keytool -genkeypair -v -keystore keystore/syhome.jks -alias syhome \
              -keyalg RSA -keysize 2048 -validity 10000 -storepass syhome123 -keypass syhome123 \
              -dname "CN=Sy Home, OU=Dev, O=SyHome, C=DE"
          fi
          if [ -n "$(git status --porcelain keystore)" ]; then
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add keystore
            git commit -m "Add signing keystore (one time)"
            git push
          fi
          mkdir -p ~/.android
          cp keystore/debug.keystore ~/.android/debug.keystore

      # Always start from a clean project folder: old leftovers (for example the deleted installer module) must not stay
      - name: Unzip project (clean)
        run: |
          rm -rf SyHome
          unzip -q -o "${{ steps.zip.outputs.file }}"
          test -f SyHome/settings.gradle.kts
          mkdir -p SyHome/keystore
          cp keystore/syhome.jks SyHome/keystore/syhome.jks

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Accept licenses
        run: yes | sdkmanager --licenses || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build Sy Home
        run: gradle -p SyHome :app:assembleDebug --no-daemon

      # Obfuscated copy (names scrambled). Optional: a failure here never stops the normal build.
      - name: Build obfuscated release (test copy)
        continue-on-error: true
        run: gradle -p SyHome :app:assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: SyHome-APK
          path: SyHome/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: SyHome-APK-obfuscated-test
          path: SyHome/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: ignore

      # Publish ONLY the APK to the public releases repository. The source stays in this (private) repository.
      # Needs the secret RELEASES_TOKEN (fine-grained token, Contents: read and write, on the releases repository only).
      # To publish the obfuscated copy instead, change APK_PATH to SyHome/app/build/outputs/apk/release/app-release.apk
      - name: Publish APK to the public releases repo
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          PUBLIC_REPO: asaad55555asaad-byte/Sy-home-releases
          APK_PATH: SyHome/app/build/outputs/apk/debug/app-debug.apk
        run: |
          VER=$(grep -m1 'versionName' SyHome/app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          cp "$APK_PATH" "SyHome-v${VER}.apk"
          if [ -n "$RELEASES_TOKEN" ]; then
            export GH_TOKEN="$RELEASES_TOKEN"
            REPO="$PUBLIC_REPO"
          else
            echo "RELEASES_TOKEN is not set: publishing to this repository instead"
            export GH_TOKEN="${{ github.token }}"
            REPO="${{ github.repository }}"
          fi
          gh release delete "v${VER}" --repo "$REPO" --yes --cleanup-tag 2>/dev/null || true
          gh release create "v${VER}" "SyHome-v${VER}.apk" --repo "$REPO" --title "Sy Home v${VER}" \
            --notes "Sy Home ${VER}"
